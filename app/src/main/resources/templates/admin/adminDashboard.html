<!-- adminDashboard.html -->
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" th:href="@{/assets/images/logo/logo.png}" />

  <!-- Stylesheets -->
  <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}">
  <link rel="stylesheet" th:href="@{/assets/css/style.css}">

  <!-- Utility and Render Scripts -->
  <script th:src="@{/js/render.js}" defer></script>
  <script th:src="@{/js/util.js}" defer></script>

  <!-- Layout Component Scripts -->
  <script th:src="@{/js/components/header.js}" defer></script>
  <script th:src="@{/js/components/footer.js}" defer></script>
</head>

<body>
  <div class="container">
    <div class="wrapper">

      <!-- Dynamic Header (header.js injects an "Add Doctor" button here) -->
      <div id="header"></div>

      <!-- Main Dashboard Content -->
      <main class="main-content">

        <!-- Search Bar -->
        <input
          type="text"
          id="searchBar"
          placeholder="search by doctor name"
        />

        <!-- Filter Section -->
        <div class="filters">
          <!-- Filter by Time -->
          <select id="timeFilter">
            <option value="">Sort by Time</option>
            <option value="AM">AM</option>
            <option value="PM">PM</option>
          </select>

          <!-- Filter by Specialty -->
          <select id="specialtyFilter">
            <option value="">Filter by Specialty</option>
            <option value="Cardiologist">Cardiologist</option>
            <option value="Dentist">Dentist</option>
            <option value="Dermatologist">Dermatologist</option>
            <option value="General Physician">General Physician</option>
            <option value="Neurologist">Neurologist</option>
            <option value="Orthopedic">Orthopedic</option>
            <option value="Pediatrician">Pediatrician</option>
            <option value="Psychiatrist">Psychiatrist</option>
          </select>
        </div>

        <!-- Dynamic Doctor Cards Area -->
        <div id="content"></div>

      </main>

      <!-- Dynamic Footer -->
      <div id="footer"></div>

    </div>
  </div>

  <!-- Modal for Adding New Doctor (hidden by default) -->
  <div id="modal" class="modal">
    <span id="closeModal" class="close">&times;</span>
    <div id="modal-body"></div>
  </div>

  <!-- Page-specific module scripts -->
  <script type="module" th:src="@{/js/services/adminDashboard.js}" defer></script>
  <script type="module" th:src="@{/js/components/doctorCard.js}" defer></script>

</body>

</html>
